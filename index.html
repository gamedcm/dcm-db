<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGENDB</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--accent-color);
      margin: 0;
    }

    /* フィルタコントロールエリア */
    .filter-control-container {
      background: var(--card-bg);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
    }

    .series-select {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      cursor: pointer;
    }

    .series-select:focus {
      border-color: var(--accent-color);
    }

    /* 武装強化パーツショートカット（7種） */
    .quick-parts-container {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
      width: 100%;
    }

    .quick-parts-title {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .quick-parts-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (min-width: 480px) {
      .quick-parts-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .part-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
    }

    .part-btn:hover, .part-btn.active {
      background: #1e3a8a;
      border-color: var(--accent-color);
    }

    .part-btn img {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }

    /* 件数カウンター表示バー */
    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .result-count {
      color: #38bdf8;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .stage-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.25s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stage-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .work-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .stage-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .drop-section {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .drop-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .drop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 機体ドロップタグ（区別用） */
    .drop-tag-unit {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 武装パーツドロップタグ（区別用） */
    .drop-tag-part {
      background: #0f172a;
      border: 1px solid var(--accent-color);
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .drop-tag-part:hover { 
      background: #1e3a8a; 
    }

    .drop-img-thumb {
      width: 20px;
      height: 20px;
      object-fit: cover;
      border-radius: 3px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>GGENDB</h1>
  </div>

  <!-- 作品（シリーズ）ごとフィルター -->
  <div class="filter-control-container">
    <label class="filter-label" for="seriesSelect">🎬 作品（シリーズ）で絞り込み</label>
    <select id="seriesSelect" class="series-select" onchange="handleSeriesChange()">
      <option value="">すべての作品を表示</option>
    </select>
  </div>

  <!-- 武装強化パーツの画像ショートカット（7種） -->
  <div class="quick-parts-container">
    <div class="quick-parts-title">🎯 武装強化パーツで絞り込み</div>
    <div class="quick-parts-list" id="partButtons">
      <button class="part-btn" data-tag="物理射撃" onclick="filterByTag('物理射撃')">
        <img src="./images/shageki.webp" alt="物理射撃" onerror="this.style.display='none'">
        <span>物理射撃</span>
      </button>
      <button class="part-btn" data-tag="物理格闘" onclick="filterByTag('物理格闘')">
        <img src="./images/kakutou.webp" alt="物理格闘" onerror="this.style.display='none'">
        <span>物理格闘</span>
      </button>
      <button class="part-btn" data-tag="ビーム射撃" onclick="filterByTag('ビーム射撃')">
        <img src="./images/beam_shageki.webp" alt="ビーム射撃" onerror="this.style.display='none'">
        <span>ビーム射撃</span>
      </button>
      <button class="part-btn" data-tag="ビーム格闘" onclick="filterByTag('ビーム格闘')">
        <img src="./images/beam_kakutou.webp" alt="ビーム格闘" onerror="this.style.display='none'">
        <span>ビーム格闘</span>
      </button>
      <button class="part-btn" data-tag="特殊射撃" onclick="filterByTag('特殊射撃')">
        <img src="./images/tokushu_shageki.webp" alt="特殊射撃" onerror="this.style.display='none'">
        <span>特殊射撃</span>
      </button>
      <button class="part-btn" data-tag="特殊格闘" onclick="filterByTag('特殊格闘')">
        <img src="./images/tokushu_kakutou.webp" alt="特殊格闘" onerror="this.style.display='none'">
        <span>特殊格闘</span>
      </button>
      <button class="part-btn" data-tag="覚醒" onclick="filterByTag('覚醒')">
        <img src="./images/kakusei.webp" alt="覚醒" onerror="this.style.display='none'">
        <span>覚醒</span>
      </button>
    </div>
  </div>

  <!-- 件数カウンターバー -->
  <div class="result-bar">
    <span id="filterStatus">表示中: すべて</span>
    <span>該当: <span id="resultCount" class="result-count">0</span> 件</span>
  </div>

  <!-- リスト表示エリア -->
  <ul id="stageList" class="stage-list"></ul>
</div>

<script>
  let stages = [];
  let currentPartFilter = '';
  let currentSeriesFilter = '';

  // GitHub上の data.json を非同期読み込み
  async function loadDataFromGitHub() {
    const listElement = document.getElementById('stageList');
    listElement.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:20px;">データを読み込み中...</li>';

    try {
      const response = await fetch('data.json?t=' + new Date().getTime());
      if (!response.ok) throw new Error('data.json の読み込みに失敗しました');
      
      stages = await response.json();
      initSeriesDropdown();
      renderStageView();
    } catch (error) {
      console.error(error);
      listElement.innerHTML = '<li style="text-align:center; color:#ef4444; padding:20px;">データの読み込みに失敗しました。<br>data.json が存在するか確認してください。</li>';
    }
  }

  // 作品プルダウンの選択肢を動的生成
  function initSeriesDropdown() {
    const seriesSet = new Set();
    stages.forEach(stage => {
      if (stage.series) seriesSet.add(stage.series);
    });

    const selectEl = document.getElementById('seriesSelect');
    seriesSet.forEach(series => {
      const option = document.createElement('option');
      option.value = series;
      option.textContent = series;
      selectEl.appendChild(option);
    });
  }

  function handleSeriesChange() {
    const selectEl = document.getElementById('seriesSelect');
    currentSeriesFilter = selectEl.value;
    renderStageView();
  }

  function filterByTag(tagName) {
    if (currentPartFilter === tagName) {
      currentPartFilter = '';
    } else {
      currentPartFilter = tagName;
    }
    
    document.querySelectorAll('.part-btn').forEach(btn => {
      if (btn.getAttribute('data-tag') === currentPartFilter) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    renderStageView();
  }

  // 武装強化パーツに対応するWebP画像のパスを判定
  function getMaterialImagePath(name) {
    const paths = {
      '物理射撃': './images/shageki.webp',
      '物理格闘': './images/kakutou.webp',
      'ビーム射撃': './images/beam_shageki.webp',
      'ビーム格闘': './images/beam_kakutou.webp',
      '特殊射撃': './images/tokushu_shageki.webp',
      '特殊格闘': './images/tokushu_kakutou.webp',
      '覚醒': './images/kakusei.webp'
    };
    return paths[name] || null;
  }

  /* --- ステージ一覧表示 --- */
  function renderStageView() {
    const listElement = document.getElementById('stageList');
    const resultCountEl = document.getElementById('resultCount');
    const filterStatusEl = document.getElementById('filterStatus');

    listElement.innerHTML = '';

    // フィルタリング処理（作品フィルター ＆ パーツフィルター）
    const filteredStages = stages.filter(stage => {
      // 作品マッチ判定
      if (currentSeriesFilter && stage.series !== currentSeriesFilter) {
        return false;
      }
      // パーツマッチ判定
      if (currentPartFilter) {
        const dropsMatch = (stage.drops || []).some(d => {
          return (d.type === 'part' || !d.type) && d.name === currentPartFilter;
        });
        if (!dropsMatch) return false;
      }
      return true;
    });

    resultCountEl.textContent = filteredStages.length;
    
    let statusText = [];
    if (currentSeriesFilter) statusText.push(`作品: ${currentSeriesFilter}`);
    if (currentPartFilter) statusText.push(`パーツ: ${currentPartFilter}`);
    filterStatusEl.textContent = statusText.length > 0 ? `絞り込み [ ${statusText.join(' / ')} ]` : '表示中: すべて';

    if (filteredStages.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">該当するステージ情報はありません</li>';
      return;
    }

    filteredStages.forEach((stage, index) => {
      const li = document.createElement('li');
      li.className = 'stage-item';
      li.style.animationDelay = `${Math.min(index * 0.04, 0.3)}s`;

      const dropsList = stage.drops || [];
      const dropTagsHtml = dropsList.map(drop => {
        // 型ゆれ対策（string型、あるいは古いデータ形式混入への安全フォールバック）
        const isString = typeof drop === 'string';
        const name = isString ? drop : (drop.name || '');
        const type = isString ? 'unit' : (drop.type || 'unit');

if (type === 'part') {
          // 武装パーツタグ（クリックで絞り込み可能・アイコン付き）
          const img = getMaterialImagePath(name);
          const imgHtml = img ? `<img src="${img}" class="drop-img-thumb" alt="" onerror="this.style.display='none'">` : '🎯';
          return `
            <span class="drop-tag-part" onclick="filterByTag('${escapeHtml(name)}')">
              ${imgHtml} ${escapeHtml(name)}
            </span>
          `;
        } else {
          // 機体ドロップタグ（区別してシンプルに表示）
          return `
            <span class="drop-tag-unit">
              🤖 ${escapeHtml(name)}
            </span>
          `;
        }
      }).join('');

      const seriesHtml = stage.series ? `<span class="work-tag">🎬 ${escapeHtml(stage.series)}</span>` : '';

      li.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            ${seriesHtml}
            <span class="stage-title">${escapeHtml(stage.name)}</span>
          </div>
        </div>
        
        <div class="drop-section">
          <div class="drop-title">🎁 ドロップアイテム・素材</div>
          <div class="drop-tags">
            ${dropTagsHtml || '<span style="font-size:0.8rem; color:#64748b;">登録なし</span>'}
          </div>
        </div>
      `;

      listElement.appendChild(li);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadDataFromGitHub();
  });
</script>

</body>
</html>
