<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gジェネ エターナル ドロップ一覧データベース</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    /* ビュー切替タブ */
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      font-weight: bold;
      background: var(--card-bg);
      color: #94a3b8;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    .input-card, .search-card, .backup-card, .series-mgmt-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #94a3b8;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    button.btn-add {
      background: #0284c7;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 5px;
    }

    button.btn-add:hover { background: #0369a1; }

    .backup-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-export, .btn-import {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      text-align: center;
    }

    .btn-export { background: #059669; color: white; }
    .btn-export:hover { background: #047857; }
    .btn-import { background: #4f46e5; color: white; }
    .btn-import:hover { background: #4338ca; }

    .stage-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stage-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .work-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .stage-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit-stage {
      background: #d97706;
      color: #fef3c7;
      border: none;
      cursor: pointer;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      width: auto;
    }

    .btn-edit-stage:hover { background: #b45309; }

    .btn-delete-stage {
      background: #7f1d1d;
      color: #fca5a5;
      border: none;
      cursor: pointer;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      width: auto;
    }

    .btn-delete-stage:hover { background: #991b1b; }

    .drop-section {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .drop-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .drop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .drop-tag {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .drop-tag:hover { background: #1e3a8a; }

    .drop-img-thumb {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
    }

    .tag-delete {
      cursor: pointer;
      color: #ef4444;
      font-weight: bold;
      margin-left: 2px;
    }

    .drop-input-group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .drop-input-group input[type="text"] {
      flex: 1;
      padding: 6px 8px;
      font-size: 0.8rem;
    }

    .file-btn-label {
      padding: 6px 10px;
      font-size: 0.8rem;
      background: #334155;
      color: #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .file-btn-label:hover { background: #475569; }

    .drop-input-group button {
      width: auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      background: #0284c7;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* 逆引きカード表示用 */
    .reverse-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .reverse-item-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reverse-img-lg {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--accent-color);
    }

    .reverse-stage-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reverse-stage-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* 作品管理UI */
    .series-list-mgmt {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 400px;
      overflow-y: auto;
    }

    .series-mgmt-item {
      background: #0f172a;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .series-mgmt-item input[type="text"] {
      padding: 4px 8px;
      font-size: 0.85rem;
    }

    .series-mgmt-actions {
      display: flex;
      gap: 4px;
    }

    .series-mgmt-actions button {
      width: auto;
      padding: 4px 8px;
      font-size: 0.75rem;
    }

    .edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-save-edit {
      background: #16a34a;
      color: white;
      border: none;
      cursor: pointer;
      padding: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
    }

    .btn-cancel-edit {
      background: #475569;
      color: white;
      border: none;
      cursor: pointer;
      padding: 6px;
      font-size: 0.85rem;
      border-radius: 4px;
    }

    .edit-buttons {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Gジェネエターナル ドロップ一覧DB</h1>

  <!-- 表示モード切替タブ -->
  <div class="view-tabs">
    <button class="tab-btn active" id="tabStage" onclick="switchView('stage')">ステージ一覧</button>
    <button class="tab-btn" id="tabReverse" onclick="switchView('reverse')">素材から探す（逆引き）</button>
    <button class="tab-btn" id="tabSeries" onclick="switchView('series')">🎬 作品名一覧の編集</button>
  </div>

  <!-- ステージ登録エリア -->
  <div class="input-card" id="stageInputCard">
    <div class="form-group">
      <label for="seriesInput">作品名（候補から選択・または直接入力）</label>
      <input type="text" id="seriesInput" list="seriesList" placeholder="例: 機動戦士ガンダム">
      <datalist id="seriesList"></datalist>
    </div>

    <div class="form-group">
      <label for="stageName">ステージ名 / 場所</label>
      <input type="text" id="stageName" placeholder="例: STAGE 3 (Hard)">
    </div>

    <div class="form-group">
      <label for="stageDrops">ドロップ素材・ユニット（カンマ区切りで複数可）</label>
      <input type="text" id="stageDrops" placeholder="例: 高機動型ザク素材, 開発データA, キャピタル">
    </div>
    <button class="btn-add" onclick="addStage()">ステージを登録する</button>
  </div>

  <!-- 作品管理エリア -->
  <div class="series-mgmt-card" id="seriesMgmtCard" style="display: none;">
    <label>🎬 作品名の新規登録</label>
    <div class="drop-input-group" style="margin-bottom:15px;">
      <input type="text" id="newSeriesName" placeholder="新しい作品名を入力">
      <button onclick="addCustomSeries()" style="background:#0284c7; color:white;">追加</button>
    </div>
    <label>📋 登録済み作品名一覧（編集・削除）</label>
    <ul id="seriesMgmtList" class="series-list-mgmt"></ul>
  </div>

  <!-- 検索エリア -->
  <div class="search-card" id="searchCard">
    <div class="form-group" style="margin-bottom:0;">
      <label for="searchInput" id="searchLabel">🔍 検索（作品名・ステージ名・ドロップ素材名）</label>
      <input type="text" id="searchInput" placeholder="例: ガンダム, ザク, 開発データ, STAGE 3" oninput="renderCurrentView()">
    </div>
  </div>

  <!-- バックアップ・復元エリア -->
  <div class="backup-card">
    <label>💾 データのバックアップ / 復元</label>
    <div class="backup-buttons">
      <button class="btn-export" onclick="exportData()">バックアップ保存 (JSON)</button>
      <button class="btn-import" onclick="document.getElementById('importFile').click()">データ復元 (JSON)</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importData(event)">
  </div>

  <!-- リスト表示エリア -->
  <ul id="stageList" class="stage-list"></ul>
</div>

<script>
  const defaultSeries = [
    "機動戦士ガンダム",
    "機動戦士ガンダム 第08MS小隊",
    "機動戦士ガンダム0080 ポケットの中の戦争",
    "機動戦士ガンダム0083 STARDUST MEMORY",
    "機動戦士Zガンダム",
    "機動戦士ガンダムZZ",
    "機動戦士ガンダム 逆襲のシャア",
    "機動戦士ガンダムUC",
    "機動戦士ガンダムNT",
    "機動戦士ガンダム 閃光のハサウェイ",
    "機動戦士ガンダムF91",
    "機動戦士Vガンダム",
    "機動武闘伝Gガンダム",
    "新機動戦記ガンダムW",
    "機動新世紀ガンダムX",
    "∀ガンダム",
    "機動戦士ガンダムSEED",
    "機動戦士ガンダムSEED DESTINY",
    "機動戦士ガンダム00",
    "機動戦士ガンダムAGE",
    "ガンダム Gのレコンギスタ",
    "機動戦士ガンダム 鉄血のオルフェンズ",
    "機動戦士ガンダム 水星の魔女",
    "機動戦士ガンダム外伝 THE BLUE DESTINY"
  ];

  let customSeries = JSON.parse(localStorage.getItem('ggene_series_list')) || defaultSeries;
  let stages = JSON.parse(localStorage.getItem('ggene_drop_db')) || [];
  let editingStageId = null;
  let editingSeriesIndex = null;
  let currentView = 'stage';

  function saveStages() {
    localStorage.setItem('ggene_drop_db', JSON.stringify(stages));
  }

  function saveSeries() {
    localStorage.setItem('ggene_series_list', JSON.stringify(customSeries));
    updateSeriesDatalist();
  }

  function updateSeriesDatalist() {
    const datalist = document.getElementById('seriesList');
    datalist.innerHTML = customSeries.map(series => `<option value="${escapeHtml(series)}">`).join('');
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('tabStage').classList.toggle('active', view === 'stage');
    document.getElementById('tabReverse').classList.toggle('active', view === 'reverse');
    document.getElementById('tabSeries').classList.toggle('active', view === 'series');

    document.getElementById('stageInputCard').style.display = (view === 'stage') ? 'block' : 'none';
    document.getElementById('seriesMgmtCard').style.display = (view === 'series') ? 'block' : 'none';
    document.getElementById('searchCard').style.display = (view === 'series') ? 'none' : 'block';

    const searchLabel = document.getElementById('searchLabel');
    if (view === 'stage') {
      searchLabel.textContent = '🔍 検索（作品名・ステージ名・ドロップ素材名）';
    } else if (view === 'reverse') {
      searchLabel.textContent = '🔍 素材名で絞り込み';
    }

    renderCurrentView();
  }

  function filterByTag(tagName) {
    const searchInput = document.getElementById('searchInput');
    searchInput.value = tagName;
    renderCurrentView();
    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* --- 作品管理機能 --- */
  function addCustomSeries() {
    const input = document.getElementById('newSeriesName');
    const val = input.value.trim();
    if (!val) return;

    if (!customSeries.includes(val)) {
      customSeries.push(val);
      saveSeries();
      input.value = '';
      renderSeriesMgmtView();
    } else {
      alert('すでに登録されている作品名です');
    }
  }

  function startEditSeries(index) {
    editingSeriesIndex = index;
    renderSeriesMgmtView();
  }

  function cancelEditSeries() {
    editingSeriesIndex = null;
    renderSeriesMgmtView();
  }

  function saveEditSeries(index) {
    const input = document.getElementById(`edit-series-input-${index}`);
    const oldVal = customSeries[index];
    const newVal = input.value.trim();

    if (!newVal) {
      alert('作品名を入力してください');
      return;
    }

    if (oldVal !== newVal) {
      stages = stages.map(stage => {
        if (stage.series === oldVal) {
          return { ...stage, series: newVal };
        }
        return stage;
      });
      saveStages();

      customSeries[index] = newVal;
      saveSeries();
    }

    editingSeriesIndex = null;
    renderSeriesMgmtView();
  }

  function deleteSeries(index) {
    const targetName = customSeries[index];
    if (confirm(`作品「${targetName}」を作品リストから削除しますか？`)) {
      customSeries.splice(index, 1);
      saveSeries();
      renderSeriesMgmtView();
    }
  }

  /* --- ステージ登録機能 --- */
  function addStage() {
    const seriesInput = document.getElementById('seriesInput');
    const nameInput = document.getElementById('stageName');
    const dropsInput = document.getElementById('stageDrops');

    if (!nameInput.value.trim()) {
      alert('ステージ名を入力してください');
      return;
    }

    const seriesVal = seriesInput.value.trim();
    if (seriesVal && !customSeries.includes(seriesVal)) {
      customSeries.push(seriesVal);
      saveSeries();
    }

    const initialDrops = dropsInput.value
      .split(/[,、]/)
      .map(item => item.trim())
      .filter(item => item.length > 0)
      .map(name => ({ name: name, image: null }));

    const newStage = {
      id: Date.now(),
      series: seriesVal,
      name: nameInput.value.trim(),
      drops: initialDrops
    };

    stages.unshift(newStage);
    saveStages();
    renderCurrentView();

    seriesInput.value = '';
    nameInput.value = '';
    dropsInput.value = '';
  }

  function startEdit(stageId) {
    editingStageId = stageId;
    renderCurrentView();
  }

  function cancelEdit() {
    editingStageId = null;
    renderCurrentView();
  }

  function saveEdit(stageId) {
    const editSeries = document.getElementById(`edit-series-${stageId}`).value.trim();
    const editName = document.getElementById(`edit-name-${stageId}`).value.trim();

    if (!editName) {
      alert('ステージ名を入力してください');
      return;
    }

    if (editSeries && !customSeries.includes(editSeries)) {
      customSeries.push(editSeries);
      saveSeries();
    }

    stages = stages.map(stage => {
      if (stage.id === stageId) {
        return {
          ...stage,
          series: editSeries,
          name: editName
        };
      }
      return stage;
    });

    editingStageId = null;
    saveStages();
    renderCurrentView();
  }

  function addDropItem(stageId) {
    const textInput = document.getElementById(`drop-input-${stageId}`);
    const fileInput = document.getElementById(`drop-file-${stageId}`);
    const val = textInput.value.trim();

    if (!val) return;

    const file = fileInput.files[0];

    const processAdd = (imageDataStr) => {
      stages = stages.map(stage => {
        if (stage.id === stageId) {
          const updatedDrops = stage.drops || [];
          // 既存データの互換性維持（文字列オブジェクトへの統一）
          const normalizedDrops = updatedDrops.map(d => typeof d === 'string' ? { name: d, image: null } : d);
          
          if (!normalizedDrops.some(d => d.name === val)) {
            normalizedDrops.push({ name: val, image: imageDataStr });
          }
          return { ...stage, drops: normalizedDrops };
        }
        return stage;
      });

      saveStages();
      renderCurrentView();
    };

    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        processAdd(e.target.result);
      };
      reader.readAsDataURL(file);
    } else {
      processAdd(null);
    }
  }

  function removeDropItem(stageId, dropName, event) {
    if (event) event.stopPropagation();
    stages = stages.map(stage => {
      if (stage.id === stageId) {
        return {
          ...stage,
          drops: (stage.drops || []).filter(item => {
            const name = typeof item === 'string' ? item : item.name;
            return name !== dropName;
          })
        };
      }
      return stage;
    });

    saveStages();
    renderCurrentView();
  }

  function deleteStage(stageId) {
    if (confirm('このステージ情報を削除しますか？')) {
      stages = stages.filter(stage => stage.id !== stageId);
      saveStages();
      renderCurrentView();
    }
  }

  function exportData() {
    if (stages.length === 0 && customSeries.length === 0) {
      alert('出力するデータがありません。');
      return;
    }
    const exportPayload = {
      stages: stages,
      customSeries: customSeries
    };
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", `ggene_drop_db_backup_${new Date().toISOString().slice(0,10)}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        
        let newStages = [];
        let newSeries = [];

        if (Array.isArray(importedData)) {
          newStages = importedData;
          newSeries = defaultSeries;
        } else {
          newStages = importedData.stages || [];
          newSeries = importedData.customSeries || defaultSeries;
        }

        if (confirm('既存のデータを上書きして復元しますか？')) {
          stages = newStages;
          customSeries = newSeries;
          saveStages();
          saveSeries();
          renderCurrentView();
          alert('データの復元が完了しました！');
        }
      } catch (err) {
        alert('ファイルの読み込みに失敗しました。正しいJSONファイルか確認してください。');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function renderCurrentView() {
    if (currentView === 'stage') {
      renderStageView();
    } else if (currentView === 'reverse') {
      renderReverseView();
    } else {
      renderSeriesMgmtView();
    }
  }

  /* --- 1. ステージ一覧表示 --- */
  function renderStageView() {
    const listElement = document.getElementById('stageList');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    listElement.innerHTML = '';

    const filteredStages = stages.filter(stage => {
      if (!searchQuery) return true;
      const seriesMatch = (stage.series || '').toLowerCase().includes(searchQuery);
      const nameMatch = stage.name.toLowerCase().includes(searchQuery);
      const dropsMatch = (stage.drops || []).some(d => {
        const dName = typeof d === 'string' ? d : d.name;
        return dName.toLowerCase().includes(searchQuery);
      });
      return seriesMatch || nameMatch || dropsMatch;
    });

    if (filteredStages.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">該当するステージ情報はありません</li>';
      return;
    }

    filteredStages.forEach(stage => {
      const li = document.createElement('li');
      li.className = 'stage-item';

      if (editingStageId === stage.id) {
        li.innerHTML = `
          <div class="edit-form">
            <div class="form-group">
              <label>作品名</label>
              <input type="text" id="edit-series-${stage.id}" list="seriesList" value="${escapeHtml(stage.series || '')}">
            </div>
            <div class="form-group">
              <label>ステージ名</label>
              <input type="text" id="edit-name-${stage.id}" value="${escapeHtml(stage.name)}">
            </div>
            <div class="edit-buttons">
              <button class="btn-save-edit" onclick="saveEdit(${stage.id})">保存</button>
              <button class="btn-cancel-edit" onclick="cancelEdit()">キャンセル</button>
            </div>
          </div>
        `;
      } else {
        const dropsList = stage.drops || [];
        const dropTagsHtml = dropsList.map(drop => {
          const name = typeof drop === 'string' ? drop : drop.name;
          const img = typeof drop === 'object' && drop.image ? drop.image : null;
          const imgHtml = img ? `<img src="${img}" class="drop-img-thumb" alt="">` : '📦';

          return `
            <span class="drop-tag" onclick="filterByTag('${escapeHtml(name)}')">
              ${imgHtml} ${escapeHtml(name)}
              <span class="tag-delete" onclick="removeDropItem(${stage.id}, '${escapeHtml(name)}', event)">×</span>
            </span>
          `;
        }).join('');

        const seriesHtml = stage.series ? `<span class="work-tag">🎬 ${escapeHtml(stage.series)}</span>` : '';

        li.innerHTML = `
          <div class="stage-header">
            <div class="stage-title-group">
              ${seriesHtml}
              <span class="stage-title">${escapeHtml(stage.name)}</span>
            </div>
            <div class="header-actions">
              <button class="btn-edit-stage" onclick="startEdit(${stage.id})">編集</button>
              <button class="btn-delete-stage" onclick="deleteStage(${stage.id})">削除</button>
            </div>
          </div>
          
          <div class="drop-section">
            <div class="drop-title">🎁 ドロップアイテム・素材（タップで検索）</div>
            <div class="drop-tags">
              ${dropTagsHtml || '<span style="font-size:0.8rem; color:#64748b;">登録なし</span>'}
            </div>
            <div class="drop-input-group">
              <input type="text" id="drop-input-${stage.id}" placeholder="素材名を入力">
              <label class="file-btn-label">
                📷 WebPを選択
                <input type="file" id="drop-file-${stage.id}" accept="image/webp,image/*" style="display:none;" onchange="updateFileLabel(${stage.id})">
              </label>
              <span id="file-name-label-${stage.id}" style="font-size:0.75rem; color:#38bdf8;"></span>
              <button onclick="addDropItem(${stage.id})">追加</button>
            </div>
          </div>
        `;
      }

      listElement.appendChild(li);
    });
  }

  function updateFileLabel(stageId) {
    const fileInput = document.getElementById(`drop-file-${stageId}`);
    const label = document.getElementById(`file-name-label-${stageId}`);
    if (fileInput.files.length > 0) {
      label.textContent = `[選択済]`;
    } else {
      label.textContent = '';
    }
  }

  /* --- 2. 素材からの逆引き表示 --- */
  function renderReverseView() {
    const listElement = document.getElementById('stageList');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    listElement.innerHTML = '';

    const dropMap = {};
    stages.forEach(stage => {
      (stage.drops || []).forEach(drop => {
        const name = typeof drop === 'string' ? drop : drop.name;
        const img = typeof drop === 'object' ? drop.image : null;

        if (!dropMap[name]) {
          dropMap[name] = { stages: [], image: img };
        }
        if (!dropMap[name].image && img) {
          dropMap[name].image = img;
        }

        const displayName = stage.series ? `[${stage.series}] ${stage.name}` : stage.name;
        dropMap[name].stages.push(displayName);
      });
    });

    const allMaterials = Object.keys(dropMap).sort();

    const filteredMaterials = allMaterials.filter(mat => {
      if (!searchQuery) return true;
      return mat.toLowerCase().includes(searchQuery);
    });

    if (filteredMaterials.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">登録されているドロップ素材はありません</li>';
      return;
    }

    filteredMaterials.forEach(mat => {
      const data = dropMap[mat];
      const li = document.createElement('li');
      li.className = 'reverse-item';

      const imgHtml = data.image ? `<img src="${data.image}" class="reverse-img-lg" alt="">` : '📦';

      const stageBadgesHtml = data.stages.map(name => `
        <div class="reverse-stage-badge">
          <span>📍 ${escapeHtml(name)}</span>
        </div>
      `).join('');

      li.innerHTML = `
        <div class="reverse-item-title">${imgHtml} ${escapeHtml(mat)}</div>
        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">獲得可能なステージ（全${data.stages.length}件）:</div>
        <div class="reverse-stage-list">
          ${stageBadgesHtml}
        </div>
      `;

      listElement.appendChild(li);
    });
  }

  /* --- 3. 作品一覧管理表示 --- */
  function renderSeriesMgmtView() {
    const mgmtList = document.getElementById('seriesMgmtList');
    document.getElementById('stageList').innerHTML = '';

    mgmtList.innerHTML = '';

    customSeries.forEach((series, index) => {
      const li = document.createElement('li');
      li.className = 'series-mgmt-item';

      if (editingSeriesIndex === index) {
        li.innerHTML = `
          <input type="text" id="edit-series-input-${index}" value="${escapeHtml(series)}" style="flex:1;">
          <div class="series-mgmt-actions">
            <button class="btn-save-edit" onclick="saveEditSeries(${index})">保存</button>
            <button class="btn-cancel-edit" onclick="cancelEditSeries()">中断</button>
          </div>
        `;
      } else {
        li.innerHTML = `
          <span style="font-size:0.9rem;">🎬 ${escapeHtml(series)}</span>
          <div class="series-mgmt-actions">
            <button class="btn-edit-stage" onclick="startEditSeries(${index})">編集</button>
            <button class="btn-delete-stage" onclick="deleteSeries(${index})">削除</button>
          </div>
        `;
      }

      mgmtList.appendChild(li);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }

  // 初期化
  updateSeriesDatalist();
  renderCurrentView();
</script>

</body>
</html>
