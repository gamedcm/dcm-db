<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGENDB</title>
  <style>
    :root {
      /* Tokens from DESIGN.md */
      --color-just-black: #0e100f;
      --color-surface-cream: #fffce1;
      --color-surface-50: #7c7c6f;
      --color-surface-25: #42433d;
      --color-off-black: #191919;
      --color-shockingly-green: #0ae448;
      --color-light-green: #abff84;
      --color-orangey: #ff8709;
      --color-pink: #fec5fb;
      --color-lilac: #9d95ff;
      --color-blue: #00bae2;
      --color-core-green: #dfffd1;
      --color-lipstick-pink: #f100cb;

      --font-mori: 'Mori', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      /* UI Mappings */
      --bg-color: var(--color-just-black);
      --card-bg: var(--color-off-black);
      --text-color: var(--color-surface-cream);
      --accent-color: var(--color-shockingly-green);
      --border-color: var(--color-surface-25);
      --muted-color: var(--color-surface-50);

      --color-格闘: var(--color-pink);
      --color-射撃: var(--color-orangey);
      --color-覚醒: var(--color-blue);
    }

    body {
      font-family: var(--font-mori);
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      line-height: 1.15;
    }

    .container, .footer {
      width: 100%;
      max-width: 1280px;
    }

    .container { 
      flex: 1; 
      max-width: 650px; /* 元のレイアウト幅を維持 */
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
      gap: 8px;
    }

    h1 { 
      font-size: 1.2rem; 
      color: var(--text-color); 
      margin: 0; 
      white-space: nowrap; 
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--muted-color);
      flex: 1;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
    }

    .header-info-title { font-weight: 600; color: var(--muted-color); }

    .orange-badge {
      display: inline-block;
      border: 1px solid var(--color-orangey);
      color: var(--color-orangey);
      background: rgba(255, 135, 9, 0.1);
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .news-trigger-btn {
      background: transparent;
      border: 1px solid var(--text-color);
      color: var(--text-color);
      width: 32px;
      height: 32px;
      border-radius: 100px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .news-trigger-btn:hover { opacity: 0.8; }

    .news-modal {
      position: fixed;
      inset: 0;
      background: rgba(14, 16, 15, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .news-modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
    }

    .news-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-color);
    }

    .news-close-btn { background: none; border: none; color: var(--muted-color); font-size: 1.2rem; cursor: pointer; }
    .news-close-btn:hover { color: var(--text-color); }

    .news-modal-body {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted-color);
      line-height: 1.4;
    }

    .official-link-btn {
      display: inline-block;
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--text-color);
      padding: 10px 20px;
      border-radius: 100px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    .official-link-btn:hover { opacity: 0.8; }

    .filter-control-container, .quick-parts-container {
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      box-sizing: border-box;
      width: 100%;
    }

    .filter-control-container { display: flex; flex-direction: column; gap: 6px; }
    .filter-label, .quick-parts-title { font-size: 0.75rem; color: var(--muted-color); font-weight: 600; }

    .series-select {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      cursor: pointer;
      font-family: var(--font-mori);
    }
    .series-select:focus { border-color: var(--text-color); }

    .quick-parts-title { margin-bottom: 8px; }
    .quick-parts-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    .part-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 6px;
      border-radius: 100px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      font-weight: 600;
      font-family: var(--font-mori);
      transition: all 0.2s;
    }

    .part-btn[data-type="格闘"] { border-color: var(--color-pink); color: var(--color-pink); }
    .part-btn[data-type="射撃"] { border-color: var(--color-orangey); color: var(--color-orangey); }
    .part-btn[data-type="覚醒"] { border-color: var(--color-blue); color: var(--color-blue); }
    .part-btn[data-type="star"] { border-color: var(--border-color); color: var(--text-color); }

    .part-btn[data-type="格闘"]:hover, .part-btn[data-type="格闘"].active { background: rgba(254, 197, 251, 0.15); }
    .part-btn[data-type="射撃"]:hover, .part-btn[data-type="射撃"].active { background: rgba(255, 135, 9, 0.15); }
    .part-btn[data-type="覚醒"]:hover, .part-btn[data-type="覚醒"].active { background: rgba(0, 186, 226, 0.15); }
    .part-btn[data-type="star"]:hover, .part-btn[data-type="star"].active { background: rgba(255, 253, 225, 0.1); border-color: var(--text-color); }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted-color);
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .result-count { color: var(--accent-color); font-weight: 600; font-size: 0.9rem; }

    .stage-list { list-style: none; padding: 0; margin: 0; }

    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeIn 0.15s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stage-title { font-weight: 600; font-size: 0.9rem; color: var(--text-color); word-break: break-word; line-height: 1.35; }

    .info-sections { display: flex; flex-direction: column; gap: 4px; }
    .drop-section, .capture-section {
      background: var(--bg-color);
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .capture-section { border-color: rgba(0, 186, 226, 0.3); }

    .drop-tags { display: flex; flex-wrap: wrap; gap: 6px; }

    .drop-tag-unit, .drop-tag-capture, .drop-tag-part {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--muted-color);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .drop-tag-capture { border-color: rgba(0, 186, 226, 0.3); color: var(--color-blue); }
    .drop-tag-part { cursor: pointer; font-weight: 600; }
    .drop-tag-part[data-type="格闘"] { border-color: var(--color-pink); color: var(--color-pink); background: rgba(254, 197, 251, 0.1); }
    .drop-tag-part[data-type="射撃"] { border-color: var(--color-orangey); color: var(--color-orangey); background: rgba(255, 135, 9, 0.1); }
    .drop-tag-part[data-type="覚醒"] { border-color: var(--color-blue); color: var(--color-blue); background: rgba(0, 186, 226, 0.1); }
    .drop-tag-part:hover { opacity: 0.8; }

    .footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }
    .footer-disclaimer { font-size: 0.7rem; color: var(--muted-color); line-height: 1.4; margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>GGENDB</h1>
    <div class="header-info">
      <span class="header-info-title">次回:</span>
      <span>マスターリーグ</span>
      <span class="orange-badge">SSR以下</span>
      <span class="orange-badge">アルティメット</span>
      <span title="宇宙">🪐</span>
    </div>
    <button class="news-trigger-btn" onclick="toggleModal(true)" title="お知らせ">!</button>
  </div>

  <div class="filter-control-container">
    <label class="filter-label" for="seriesSelect">🎬 作品（シリーズ）で絞り込み</label>
    <select id="seriesSelect" class="series-select" onchange="currentSeriesFile = this.value; renderStageView()"></select>
  </div>

  <div class="quick-parts-container">
    <div class="quick-parts-title">🎯 武装強化パーツで絞り込み</div>
    <div class="quick-parts-list" id="partButtons"></div>
  </div>

  <div class="result-bar">
    <span id="filterStatus">表示中: すべて</span>
    <span>該当: <span id="resultCount" class="result-count">0</span> 件</span>
  </div>

  <ul id="stageList" class="stage-list"></ul>
</div>

<div id="newsModal" class="news-modal" onclick="if(event.target === this) toggleModal(false)">
  <div class="news-modal-content">
    <div class="news-modal-header">
      <span>📢 最新情報・お知らせ</span>
      <button class="news-close-btn" onclick="toggleModal(false)">×</button>
    </div>
    <div class="news-modal-body">
      <p>最新のアップデートや詳細なお知らせは、公式ウェブサイトをご確認ください。</p>
      <a href="https://web.jp.eternal.channel.or.jp/ja/information/update.html" target="_blank" rel="noopener noreferrer" class="official-link-btn">
        公式お知らせページを開く（外部サイト）
      </a>
    </div>
  </div>
</div>

<footer class="footer">
  <p class="footer-disclaimer">
    当サイトは個人が運営する非公式サイトであり、株式会社バンダイナムコエンターテインメントとは一切関係ありません。
    掲載しているゲームコンテンツの著作権・商標権その他の知的財産権は、株式会社バンダイナムコエンターテインメントおよび各権利者に帰属します。
  </p>
</footer>

<script>
  let stages = [], currentPartFilter = '', starFilterActive = false, currentSeriesFile = '';
  const partsData = [
    {tag: '物理格闘', type: '格闘'}, {tag: 'ビーム格闘', type: '格闘'}, {tag: '特殊格闘', type: '格闘'},
    {tag: '物理射撃', type: '射撃'}, {tag: 'ビーム射撃', type: '射撃'}, {tag: '特殊射撃', type: '射撃'},
    {tag: '覚醒', type: '覚醒'}, {tag: '★', type: 'star'}
  ];
  const knownPartKeywords = ['物理格闘', '物理射撃', 'ビーム格闘', 'ビーム射撃', '特殊格闘', '特殊射撃', '覚醒'];

  const cleanName = (name) => name ? name.replace(/^【[^】]+】\s*/, '').trim() : '';
  const getPartType = (name) => name.includes("格闘") ? "格闘" : name.includes("射撃") ? "射撃" : name.includes("覚醒") ? "覚醒" : "";
  const normalizeList = (data) => Array.isArray(data) ? data : (typeof data === 'string' ? data.split(',').map(i => i.trim()).filter(Boolean) : []);
  const toggleModal = (show) => document.getElementById('newsModal').style.display = show ? 'flex' : 'none';
  const escapeHtml = (str) => str.replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[m]));

  // パーツボタンの自動生成
  document.getElementById('partButtons').innerHTML = partsData.path ? '' : partsData.map(p => `
    <button class="part-btn" data-tag="${p.tag}" data-type="${p.type}" onclick="filterByTag('${p.tag}')">${p.tag}</button>
  `).join('');

  async function loadDataFromGitHub() {
    const listEl = document.getElementById('stageList');
    listEl.innerHTML = '<li style="text-align:center; color:var(--muted-color); padding:15px; font-size:0.85rem;">データを読み込み中...</li>';
    try {
      const res = await fetch('data.json?t=' + Date.now());
      if (!res.ok) throw new Error();
      stages = await res.json();
      
      const seriesSet = [...new Set(stages.map(s => s.series).filter(Boolean))];
      document.getElementById('seriesSelect').innerHTML = '<option value="">すべての作品を表示</option>' + 
        seriesSet.map(s => `<option value="${s}">${s}</option>`).join('');
      renderStageView();
    } catch {
      listEl.innerHTML = '<li style="text-align:center; color:var(--color-pink); padding:15px; font-size:0.85rem;">データの読み込みに失敗しました。</li>';
    }
  }

  function filterByTag(tagName) {
    if (tagName === '★') starFilterActive = !starFilterActive;
    else currentPartFilter = currentPartFilter === tagName ? '' : tagName;
    
    document.querySelectorAll('.part-btn').forEach(btn => {
      const tag = btn.dataset.tag;
      btn.classList.toggle('active', tag === '★' ? starFilterActive : tag === currentPartFilter);
    });
    renderStageView();
  }

  function renderStageView() {
    const listEl = document.getElementById('stageList');
    const filtered = stages.filter(s => {
      if (currentSeriesFile && s.series !== currentSeriesFile) return false;
      if (currentPartFilter && !normalizeList(s.drops).some(d => cleanName(typeof d === 'string' ? d : d.name) === currentPartFilter)) return false;
      if (starFilterActive && !normalizeList(s.captures).some(c => (typeof c === 'string' ? c : c.name || '').includes('★'))) return false;
      return true;
    });

    document.getElementById('resultCount').textContent = filtered.length;
    
    let status = [];
    if (currentSeriesFile) status.push(`作品: ${currentSeriesFile}`);
    if (currentPartFilter) status.push(`パーツ: ${currentPartFilter}`);
    if (starFilterActive) status.push(`★付き`);
    document.getElementById('filterStatus').textContent = status.length ? `絞り込み [ ${status.join(' / ')} ]` : '表示中: すべて';

    if (!filtered.length) {
      listEl.innerHTML = '<li style="text-align:center; color:var(--muted-color); padding:15px; font-size:0.85rem;">該当するステージ情報はありません</li>';
      return;
    }

    listEl.innerHTML = filtered.map(stage => {
      const drops = normalizeList(stage.drops).map(d => {
        const isStr = typeof d === 'string', raw = isStr ? d : (d.name || ''), name = cleanName(raw);
        return (!isStr && d.type === 'part') || knownPartKeywords.includes(name)
          ? `<span class="drop-tag-part" data-type="${getPartType(name)}" onclick="filterByTag('${escapeHtml(name)}')">🎯 ${escapeHtml(name)}</span>`
          : `<span class="drop-tag-unit">📒 ${escapeHtml(name)}</span>`;
      }).join('');

      const captures = normalizeList(stage.captures).map(c => `
        <span class="drop-tag-capture">🤖 ${escapeHtml(cleanName(typeof c === 'string' ? c : c.name))}</span>
      `).join('');

      return `
        <li class="stage-item">
          <div class="stage-title">${escapeHtml(stage.name || '')}</div>
          <div class="info-sections">
            <div class="drop-section"><div class="drop-tags">${drops || '<span style="font-size:0.75rem; color:var(--muted-color);">登録なし</span>'}</div></div>
            ${captures ? `<div class="capture-section"><div class="drop-tags">${captures}</div></div>` : ''}
          </div>
        </li>
      `;
    }).join('');
  }

  loadDataFromGitHub();
</script>
</body>
</html>
