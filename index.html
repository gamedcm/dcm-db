<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>データベース</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f4f5f7; }
    
    /* ヘッダー構成 */
    header {
      background: #2b3a4a;
      color: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* メイン機能（検索メニュー） */
    .main-nav button {
      background: #3b4e63;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-right: 5px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 4px 4px 0 0;
    }
    .main-nav button.active {
      background: #ffffff;
      color: #2b3a4a;
    }

    /* サブ機能（管理・登録メニュー） */
    .sub-nav button {
      background: transparent;
      color: #b0c4de;
      border: 1px solid #b0c4de;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 5px;
    }
    .sub-nav button:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    /* コンテンツ表示エリア */
    main { padding: 20px; background: #fff; min-height: 400px; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

  <header>
    <!-- メイン機能：大きなタブ -->
    <nav class="main-nav">
      <button class="nav-btn active" onclick="showPanel('stage-search', this)">STAGE検索</button>
      <button class="nav-btn" onclick="showPanel('material-search', this)">素材検索</button>
    </nav>

    <!-- サブ機能：控えめなボタン -->
    <nav class="sub-nav">
      <button onclick="showPanel('material-register')">＋ 素材登録</button>
      <button onclick="showPanel('work-register')">＋ 作品登録</button>
    </nav>
  </header>

  <main>
    <!-- 1-1. STAGE検索（初期表示） -->
    <section id="stage-search" class="panel active">
      <h2>STAGE検索</h2>
      <!-- 検索フォームや一覧表示欄 -->
    </section>

    <!-- 1-2. 素材検索 -->
    <section id="material-search" class="panel">
      <h2>素材検索</h2>
      <!-- 素材の検索フォームや一覧表示欄 -->
    </section>

    <!-- 2-1. 素材登録（サブ機能） -->
    <section id="material-register" class="panel">
      <h2>素材の登録</h2>
      <!-- 素材登録フォーム -->
    </section>

    <!-- 2-2. 作品登録（サブ機能） -->
    <section id="work-register" class="panel">
      <h2>作品の登録</h2>
      <!-- 作品登録フォーム -->
    </section>
  </main>

  <script>
    function showPanel(panelId, element) {
      // 全パネルを非表示
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      
      // 対象のパネルを表示
      document.getElementById(panelId).classList.add('active');

      // メインナビゲーションの見た目を更新（メインタブ選択時のみ）
      if (element && element.classList.contains('nav-btn')) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        element.classList.add('active');
      }
    }
  </script>

</body>
</html>
