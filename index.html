<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGENDB</title>
  <style>
    :root {
      --color-midnight-canvas: #05060f;
      --color-steel-plate: #2f343e;
      --color-fog-veil: #9da7ba;
      --color-moon-mist: #c7d3ea;
      --color-frost-glow: #d1e4fa;
      --color-ice-highlight: #d8ecf8;
      --gradient-ice-highlight: linear-gradient(0deg, #d8ecf8 0%, #98c0ef 100%);
      --color-pure-white: #ffffff;
      --color-void-violet: #663af3;
      --color-blueprint-blue: #b6d9fc;
      --color-gridline-blue: #3f4959;
      --color-glass-edge: #bad7f71f;
      --color-luminous-fill: #c7d3ea1f;

      --bg-color: var(--color-midnight-canvas);
      --card-bg: rgba(186, 214, 247, 0.03);
      --text-color: var(--color-frost-glow);
      --accent-color: var(--color-void-violet);
      --border-color: rgba(186, 215, 247, 0.12);

      /* 武装強化パーツカラー（Authkitのトーンに合わせて微調整） */
      --color-格闘: #fca5a5;
      --color-射撃: #fde047;
      --color-覚醒: #93c5fd; 
    }

    /* Authkit背景グリッド ＆ スポットライト効果 */
    body {
      font-family: 'Untitled Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(to right, rgba(186, 215, 247, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(186, 215, 247, 0.04) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;
      top: -5%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: conic-gradient(at 50% -5%, transparent 45%, rgba(124, 145, 182, 0.2) 49%, rgba(124, 145, 182, 0.35) 50%, rgba(124, 145, 182, 0.2) 51%, transparent 55%);
      z-index: -1;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      flex: 1;
      box-sizing: border-box;
      padding: 0 16px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 24px;
      gap: 12px;
    }

    h1 {
      font-family: 'aeonikPro', ui-sans-serif, system-ui, sans-serif;
      font-size: 28px;
      font-weight: 500;
      background: var(--gradient-ice-highlight);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    /* ヘッダー中央の告知エリア */
    .header-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--color-moon-mist);
      flex: 1;
      justify-content: center;
      overflow: hidden;
      white-space: nowrap;
      background: rgba(199, 211, 234, 0.04);
      padding: 6px 14px;
      border-radius: 999px;
      box-shadow: rgba(186, 215, 247, 0.12) 0px 0px 0px 1px inset;
    }

    .header-info-title {
      font-weight: 500;
      color: var(--color-fog-veil);
    }

    /* オレンジ色の枠で囲うタグのスタイル（Authkitのトーンに合わせて調整） */
    .orange-badge {
      display: inline-block;
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fed7aa;
      background: rgba(249, 115, 22, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    /* 地形アイコンのスタイル */
    .terrain-icons {
      display: inline-flex;
      font-size: 14px;
      margin-left: 2px;
    }

    /* 右上の！お知らせボタン（ガラスピルボタン風） */
    .news-trigger-btn {
      background: rgba(186, 214, 247, 0.06);
      border: 1px solid var(--border-color);
      color: var(--color-pure-white);
      width: 36px;
      height: 36px;
      border-radius: 999px;
      font-weight: 500;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: rgba(186, 215, 247, 0.12) 0px 0px 0px 1px inset;
      transition: background 0.15s ease, border-color 0.15s ease;
      flex-shrink: 0;
    }
    .news-trigger-btn:hover {
      background: rgba(186, 214, 247, 0.12);
      border-color: rgba(186, 215, 247, 0.24);
    }

    /* お知らせモーダルの背景（フロストグラス＆ディープグラスモーダル） */
    .news-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 6, 15, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      box-sizing: border-box;
    }

    .news-modal-content {
      background: rgba(5, 6, 15, 0.97);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 1px 1px rgba(216, 236, 248, 0.2), inset 0 24px 48px rgba(168, 216, 245, 0.06), 0 16px 32px rgba(0, 0, 0, 0.5);
    }

    .news-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 16px;
      font-weight: 500;
      color: var(--color-ice-highlight);
    }

    .news-close-btn {
      background: none;
      border: none;
      color: var(--color-moon-mist);
      font-size: 20px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .news-close-btn:hover {
      color: var(--color-pure-white);
    }

    .news-modal-body {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--color-moon-mist);
      line-height: 1.5;
    }

    /* 唯一のアクセントカラー（ボイドバイオレット）ボタン */
    .official-link-btn {
      display: inline-block;
      background: var(--color-void-violet);
      color: var(--color-pure-white);
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: 500;
      text-decoration: none;
      transition: filter 0.15s ease;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(102, 58, 243, 0.4);
    }

    .official-link-btn:hover {
      filter: brightness(1.15);
    }

    /* フィルタコントロールエリア（ガラスカード風） */
    .filter-control-container {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 1px rgba(199, 211, 234, 0.12), inset 0 24px 48px rgba(199, 211, 234, 0.03), 0 12px 24px rgba(6, 6, 14, 0.5);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-label {
      font-family: 'dotDigital', monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--color-moon-mist);
      font-weight: 400;
    }

    .series-select {
      background: rgba(199, 211, 234, 0.06);
      border: 1px solid var(--border-color);
      color: var(--color-pure-white);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .series-select:focus {
      border-color: rgba(186, 215, 247, 0.3);
    }

    .series-select option {
      background: var(--color-midnight-canvas);
      color: var(--color-pure-white);
    }

    /* 武装強化パーツショートカット */
    .quick-parts-container {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 1px rgba(199, 211, 234, 0.12), inset 0 24px 48px rgba(199, 211, 234, 0.03), 0 12px 24px rgba(6, 6, 14, 0.5);
      box-sizing: border-box;
      width: 100%;
    }

    .quick-parts-title {
      font-family: 'dotDigital', monospace;
      font-size: 13px;
      letter-spacing: 0.08em;
      color: var(--color-moon-mist);
      font-weight: 400;
      margin-bottom: 10px;
    }

    .quick-parts-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
    }

    .part-btn {
      background: rgba(186, 214, 247, 0.04);
      border: 1px solid var(--border-color);
      color: var(--color-frost-glow);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
      box-sizing: border-box;
      font-weight: 500;
    }

    .part-btn[data-type="格闘"]:hover, .part-btn[data-type="格闘"].active {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }
    .part-btn[data-type="射撃"]:hover, .part-btn[data-type="射撃"].active {
      background: rgba(234, 179, 8, 0.15);
      border-color: rgba(234, 179, 8, 0.5);
      color: #fde047;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.2);
    }
    .part-btn[data-type="覚醒"]:hover, .part-btn[data-type="覚醒"].active {
      background: rgba(37, 99, 235, 0.2);
      border-color: rgba(37, 99, 235, 0.6);
      color: #93c5fd;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.3);
    }
    .part-btn[data-type="star"]:hover, .part-btn[data-type="star"].active {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.6);
      color: #bae6fd;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    /* 件数カウンター表示バー */
    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--color-fog-veil);
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .result-count {
      color: var(--color-blueprint-blue);
      font-weight: 600;
      font-size: 14px;
    }

    .stage-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 12px;
    }

    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 1px 1px rgba(199, 211, 234, 0.1), inset 0 24px 48px rgba(199, 211, 234, 0.02), 0 8px 24px rgba(6, 6, 14, 0.5);
      contain: content;
      will-change: transform, opacity;
      animation: fadeIn 0.15s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stage-title-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      flex: 1;
    }

    .stage-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--color-ice-highlight);
      white-space: normal;
      word-break: break-word;
      line-height: 1.4;
    }

    .info-sections {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .drop-section, .capture-section {
      background: rgba(5, 6, 15, 0.4);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(186, 215, 247, 0.06);
    }

    .capture-section {
      background: rgba(5, 6, 15, 0.6);
      border-color: rgba(56, 189, 248, 0.15);
    }

    .drop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .drop-tag-unit {
      background: rgba(199, 211, 234, 0.04);
      border: 1px solid var(--border-color);
      color: var(--color-moon-mist);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .drop-tag-capture {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: #bae6fd;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .drop-tag-part {
      background: rgba(186, 214, 247, 0.06);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .drop-tag-part[data-type="格闘"] { border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; background: rgba(239, 68, 68, 0.1); }
    .drop-tag-part[data-type="射撃"] { border-color: rgba(234, 179, 8, 0.4); color: #fde047; background: rgba(234, 179, 8, 0.1); }
    .drop-tag-part[data-type="覚醒"] { border-color: rgba(37, 99, 235, 0.5); color: #93c5fd; background: rgba(37, 99, 235, 0.15); }

    .drop-tag-part:hover {
      filter: brightness(1.25);
    }

    .footer {
      width: 100%;
      max-width: 1200px;
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .footer-disclaimer {
      font-size: 11px;
      color: var(--color-fog-veil);
      line-height: 1.5;
      margin: 0;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>GGENDB</h1>
    
    <!-- 次回マスターリーグの告知エリア -->
    <div class="header-info">
      <span class="header-info-title">次回:</span>
      <span>マスターリーグ</span>
      <span class="orange-badge">SSR以下</span>
      <span class="orange-badge">アルティメット</span>
      <span class="terrain-icons" title="宇宙">🪐</span>
    </div>

    <!-- 右上の！お知らせボタン -->
    <button class="news-trigger-btn" onclick="toggleNewsModal()" title="お知らせ">
      <span>!</span>
    </button>
  </div>

  <!-- 作品（シリーズ）ごとフィルター -->
  <div class="filter-control-container">
    <label class="filter-label" for="seriesSelect">🎬 作品（シリーズ）で絞り込み</label>
    <select id="seriesSelect" class="series-select" onchange="handleSeriesChange()">
      <option value="">すべての作品を表示</option>
    </select>
  </div>

  <!-- 武装強化パーツショートカット -->
  <div class="quick-parts-container">
    <div class="quick-parts-title">🎯 武装強化パーツで絞り込み</div>
    <div class="quick-parts-list" id="partButtons">
      <button class="part-btn" data-tag="物理格闘" data-type="格闘" onclick="filterByTag('物理格闘')">
        <span>物理格闘</span>
      </button>
      <button class="part-btn" data-tag="ビーム格闘" data-type="格闘" onclick="filterByTag('ビーム格闘')">
        <span>ビーム格闘</span>
      </button>
      <button class="part-btn" data-tag="特殊格闘" data-type="格闘" onclick="filterByTag('特殊格闘')">
        <span>特殊格闘</span>
      </button>
      <button class="part-btn" data-tag="物理射撃" data-type="射撃" onclick="filterByTag('物理射撃')">
        <span>物理射撃</span>
      </button>
      <button class="part-btn" data-tag="ビーム射撃" data-type="射撃" onclick="filterByTag('ビーム射撃')">
        <span>ビーム射撃</span>
      </button>
      <button class="part-btn" data-tag="特殊射撃" data-type="射撃" onclick="filterByTag('特殊射撃')">
        <span>特殊射撃</span>
      </button>
      <button class="part-btn" data-tag="覚醒" data-type="覚醒" onclick="filterByTag('覚醒')">
        <span>覚醒</span>
      </button>
      <button class="part-btn" data-tag="★" data-type="star" onclick="filterByTag('★')">
        <span>★</span>
      </button>
    </div>
  </div>

  <!-- 件数カウンターバー -->
  <div class="result-bar">
    <span id="filterStatus">表示中: すべて</span>
    <span>該当: <span id="resultCount" class="result-count">0</span> 件</span>
  </div>

  <!-- リスト表示エリア -->
  <ul id="stageList" class="stage-list"></ul>
</div>

<!-- お知らせポップアップ -->
<div id="newsModal" class="news-modal" style="display: none;">
  <div class="news-modal-content">
    <div class="news-modal-header">
      <span>📢 最新情報・お知らせ</span>
      <button class="news-close-btn" onclick="toggleNewsModal()">×</button>
    </div>
    <div class="news-modal-body">
      <p>最新のアップデートや詳細なお知らせは、公式ウェブサイトをご確認ください。</p>
      <a href="https://web.jp.eternal.channel.or.jp/ja/information/update.html" target="_blank" rel="noopener noreferrer" class="official-link-btn">
        公式お知らせページを開く（外部サイト）
      </a>
    </div>
  </div>
</div>

<!-- フッター権利表記 -->
<footer class="footer">
  <p class="footer-disclaimer">
    当サイトは個人が運営する非公式サイトであり、株式会社バンダイナムコエンターテインメントとは一切関係ありません。
    掲載しているゲームコンテンツの著作権・商標権その他の知的財産権は、株式会社バンダイナムコエンターテインメントおよび各権利者に帰属します。
  </p>
</footer>

<script>
  let stages = [];
  let currentPartFilter = '';   
  let starFilterActive = false; 
  let currentSeriesFilter = '';

  const knownPartKeywords = ['物理格闘', '物理射撃', 'ビーム格闘', 'ビーム射撃', '特殊格闘', '特殊射撃', '覚醒'];

  function cleanName(name) {
    if (!name) return '';
    return name.replace(/^【[^】]+】\s*/, '').trim();
  }

  function getPartType(name) {
    if (name.includes("格闘")) return "格闘";
    if (name.includes("射撃")) return "射撃";
    if (name.includes("覚醒")) return "覚醒";
    return "";
  }

  function normalizeList(data) {
    if (!data) return [];
    if (Array.isArray(data)) return data;
    if (typeof data === 'string') {
      return data.split(',').map(item => item.trim()).filter(Boolean);
    }
    return [];
  }

  function toggleNewsModal() {
    const modal = document.getElementById('newsModal');
    if (modal.style.display === 'none') {
      modal.style.display = 'flex';
    } else {
      modal.style.display = 'none';
    }
  }

  window.addEventListener('click', (e) => {
    const modal = document.getElementById('newsModal');
    if (e.target === modal) {
      modal.style.display = 'none';
    }
  });

  async function loadDataFromGitHub() {
    const listElement = document.getElementById('stageList');
    listElement.innerHTML = '<li style="text-align:center; color:var(--color-moon-mist); padding:15px; font-size:14px; grid-column: 1/-1;">データを読み込み中...</li>';

    try {
      const response = await fetch('data.json?t=' + new Date().getTime());
      if (!response.ok) throw new Error('data.json の読み込みに失敗しました');
      
      stages = await response.json();
      initSeriesDropdown();
      renderStageView();
    } catch (error) {
      console.error(error);
      listElement.innerHTML = '<li style="text-align:center; color:#fca5a5; padding:15px; font-size:14px; grid-column: 1/-1;">データの読み込みに失敗しました。<br>data.json が存在するか確認してください。</li>';
    }
  }

  function initSeriesDropdown() {
    const seriesSet = new Set();
    stages.forEach(stage => {
      if (stage.series) seriesSet.add(stage.series);
    });

    const selectEl = document.getElementById('seriesSelect');
    seriesSet.forEach(series => {
      const option = document.createElement('option');
      option.value = series;
      option.textContent = series;
      selectEl.appendChild(option);
    });
  }

  function handleSeriesChange() {
    const selectEl = document.getElementById('seriesSelect');
    currentSeriesFilter = selectEl.value;
    renderStageView();
  }

  function filterByTag(tagName) {
    if (tagName === '★') {
      starFilterActive = !starFilterActive;
    } else {
      if (currentPartFilter === tagName) {
        currentPartFilter = '';
      } else {
        currentPartFilter = tagName;
      }
    }
    
    document.querySelectorAll('.part-btn').forEach(btn => {
      const tag = btn.getAttribute('data-tag');
      if (tag === '★') {
        if (starFilterActive) btn.classList.add('active');
        else btn.classList.remove('active');
      } else {
        if (tag === currentPartFilter) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    });

    renderStageView();
  }

  function renderStageView() {
    const listElement = document.getElementById('stageList');
    const resultCountEl = document.getElementById('resultCount');
    const filterStatusEl = document.getElementById('filterStatus');

    listElement.innerHTML = '';

    const filteredStages = stages.filter(stage => {
      if (currentSeriesFilter && stage.series !== currentSeriesFilter) {
        return false;
      }

      let matchesPart = true;
      if (currentPartFilter) {
        const rawDrops = normalizeList(stage.drops);
        matchesPart = rawDrops.some(d => {
          const rawName = typeof d === 'string' ? d : (d.name || '');
          const cleaned = cleanName(rawName);
          const isPart = (typeof d === 'object' && d.type === 'part') || knownPartKeywords.includes(cleaned);
          return isPart && cleaned === currentPartFilter;
        });
      }
      if (!matchesPart) return false;

      let matchesStar = true;
      if (starFilterActive) {
        const rawCaptures = normalizeList(stage.captures);
        matchesStar = rawCaptures.some(cap => {
          const rawName = typeof cap === 'string' ? cap : (cap.name || '');
          return rawName.includes('★');
        });
      }
      if (!matchesStar) return false;

      return true;
    });

    resultCountEl.textContent = filteredStages.length;
    
    let statusText = [];
    if (currentSeriesFilter) statusText.push(`作品: ${currentSeriesFilter}`);
    if (currentPartFilter) statusText.push(`パーツ: ${currentPartFilter}`);
    if (starFilterActive) statusText.push(`★付き`);
    
    filterStatusEl.textContent = statusText.length > 0 ? `絞り込み [ ${statusText.join(' / ')} ]` : '表示中: すべて';

    if (filteredStages.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:var(--color-fog-veil); padding:20px; font-size:14px; grid-column: 1/-1;">該当するステージ情報はありません</li>';
      return;
    }

    const fragment = document.createDocumentFragment();

    filteredStages.forEach((stage, index) => {
      const li = document.createElement('li');
      li.className = 'stage-item';
      li.style.animationDelay = `${Math.min(index * 0.02, 0.15)}s`;

      const dropsList = normalizeList(stage.drops);
      const dropTagsHtml = dropsList.map(drop => {
        const isString = typeof drop === 'string';
        const rawName = isString ? drop : (drop.name || '');
        const name = cleanName(rawName);
        
        const isPart = (!isString && drop.type === 'part') || knownPartKeywords.includes(name);

        if (isPart) {
          const partType = getPartType(name);
          return `
            <span class="drop-tag-part" data-type="${partType}" onclick="filterByTag('${escapeHtml(name)}')">
              🎯 ${escapeHtml(name)}
            </span>
          `;
        } else {
          return `
            <span class="drop-tag-unit">
              📒 ${escapeHtml(name)}
            </span>
          `;
        }
      }).join('');

      const captureList = normalizeList(stage.captures);
      const captureTagsHtml = captureList.map(capture => {
        const rawName = typeof capture === 'string' ? capture : (capture.name || '');
        const name = cleanName(rawName);
        return `
          <span class="drop-tag-capture">
            🤖 ${escapeHtml(name)}
          </span>
        `;
      }).join('');

      const captureSectionHtml = captureList.length > 0 ? `
        <div class="capture-section">
          <div class="drop-tags">
            ${captureTagsHtml}
          </div>
        </div>
      ` : '';

      li.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            <span class="stage-title">${escapeHtml(stage.name || '')}</span>
          </div>
        </div>
        
        <div class="info-sections">
          <div class="drop-section">
            <div class="drop-tags">
              ${dropTagsHtml || '<span style="font-size:12px; color:var(--color-fog-veil);">登録なし</span>'}
            </div>
          </div>
          ${captureSectionHtml}
        </div>
      `;

      fragment.appendChild(li);
    });

    listElement.appendChild(fragment);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadDataFromGitHub();
  });
</script>

</body>
</html>
