<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUNDAM HARD STAGE DB</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;

      /* パーツ属性カラー */
      --color-格闘: #ef4444; /* 赤 */
      --color-射撃: #eab308; /* 黄 */
      --color-覚醒: #3b82f6; /* 青 */
      --color-機体: #64748b; /* デフォルト/機体等 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.4;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      text-align: center;
      color: #38bdf8;
    }

    /* フィルターエリア */
    .filter-section {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      width: 100%;
      margin-bottom: 4px;
    }

    /* 1. UI/デザイン面の改善（パーツボタンの視認性向上） */
    .btn-filter {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-filter::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--btn-color, var(--color-機体));
    }

    .btn-filter[data-type="格闘"] { --btn-color: var(--color-格闘); }
    .btn-filter[data-type="射撃"] { --btn-color: var(--color-射撃); }
    .btn-filter[data-type="覚醒"] { --btn-color: var(--color-覚醒); }

    .btn-filter.active[data-type="格闘"] {
      background-color: rgba(239, 68, 68, 0.2);
      border-color: var(--color-格闘);
      color: #fca5a5;
    }
    .btn-filter.active[data-type="射撃"] {
      background-color: rgba(234, 179, 8, 0.2);
      border-color: var(--color-射撃);
      color: #fde047;
    }
    .btn-filter.active[data-type="覚醒"] {
      background-color: rgba(59, 130, 246, 0.2);
      border-color: var(--color-覚醒);
      color: #93c5fd;
    }
    .btn-filter.active[data-type="all"] {
      background-color: #334155;
      border-color: #94a3b8;
    }

    /* 2. ステージカードのレイアウト最適化（コンパクト化） */
    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .stage-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      /* 3. パフォーマンス最適化（GPUアクセラレーションとレイアウトシフト防止） */
      will-change: transform, opacity;
      contain: content;
    }

    .stage-header {
      margin-bottom: 6px;
    }

    .series-name {
      font-size: 0.75rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stage-name {
      font-size: 0.9rem;
      font-weight: bold;
      color: #38bdf8;
    }

    .drop-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      list-style: none;
    }

    /* バッジデザイン */
    .drop-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      display: inline-flex;
      align-items: center;
    }

    .drop-badge[data-category="格闘"] {
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
      background-color: rgba(239, 68, 68, 0.1);
    }
    .drop-badge[data-category="射撃"] {
      border-color: rgba(234, 179, 8, 0.5);
      color: #fde047;
      background-color: rgba(234, 179, 8, 0.1);

    .drop-badge[data-category="覚醒"] {
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
      background-color: rgba(59, 130, 246, 0.1);
    }

    /* 非表示アニメーションの高速化 */
    .is-hidden {
      display: none !important;
    }
  </style>
</head>

  // ドロップアイテムの属性判別用関数
  function getDropCategory(name) {
    if (name.includes("格闘")) return "格闘";
    if (name.includes("射撃")) return "射撃";
    if (name.includes("覚醒")) return "覚醒";
    return "other";
  }

  // 3. パフォーマンス最適化（DocumentFragmentの活用によるDOM操作削減）
  function renderCards() {
    const listContainer = document.getElementById("stage-list");
    const fragment = document.createDocumentFragment();

    stageData.forEach(stage => {
      const card = document.createElement("div");
      card.className = "stage-card";
      card.dataset.id = stage.id;
      
      // カード内のドロップ種別判定用データ属性
      const dropCategories = stage.drops.map(d => getDropCategory(d.name));
      card.dataset.categories = dropCategories.join(",");

      const dropBadgesHTML = stage.drops.map(drop => {
        const category = getDropCategory(drop.name);
        return `<li class="drop-badge" data-category="${category}">${drop.name}</li>`;
      }).join("");

      card.innerHTML = `
        <div class="stage-header">
          <div class="series-name">${stage.series}</div>
          <div class="stage-name">${stage.name}</div>
        </div>
        <ul class="drop-list">
          ${dropBadgesHTML}
        </ul>
      `;

      fragment.appendChild(card);
    });

    listContainer.appendChild(fragment);
  }

  // フィルターイベントハンドラー（高速リフロー処理）
  function setupFilters() {
    const buttons = document.querySelectorAll(".btn-filter");
    const cards = document.querySelectorAll(".stage-card");

    document.getElementById("filter-buttons").addEventListener("click", (e) => {
      const btn = e.target.closest(".btn-filter");
      if (!btn) return;

      const filterType = btn.dataset.type;

      // ボタンのスタイル切り替え
      buttons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");

      // 描画フレームを合わせてチラつきを抑制（requestAnimationFrame）
      requestAnimationFrame(() => {
        cards.forEach(card => {
          if (filterType === "all") {
            card.classList.remove("is-hidden");
          } else {
            const categories = card.dataset.categories.split(",");
            if (categories.includes(filterType)) {
              card.classList.remove("is-hidden");
            } else {
              card.classList.add("is-hidden");
            }
          }
        });
      });
    });
  }

  // 初期化実行
  document.addEventListener("DOMContentLoaded", () => {
    renderCards();
    setupFilters();
  });
