<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGENDB</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.3rem;
      color: var(--accent-color);
      margin: 0;
    }

    /* ビュー切替タブ */
    .view-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      font-weight: bold;
      background: var(--card-bg);
      color: #94a3b8;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #0f172a;
      border-color: var(--accent-color);
    }

    .search-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: var(--text-color);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    /* 武装強化パーツショートカット（7種対応） */
    .quick-parts-container {
      background: var(--card-bg);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    .quick-parts-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .quick-parts-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (min-width: 480px) {
      .quick-parts-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .part-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #e2e8f0;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .part-btn:hover {
      background: #1e3a8a;
      border-color: var(--accent-color);
    }

    .part-btn img {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
    }

    .stage-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .stage-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stage-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stage-title-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .work-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      width: fit-content;
    }

    .stage-title {
      font-weight: bold;
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .drop-section {
      background: rgba(15, 23, 42, 0.6);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .drop-title {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .drop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .drop-tag {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #e2e8f0;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .drop-tag:hover { background: #1e3a8a; }

    .drop-img-thumb {
      width: 24px;
      height: 24px;
      object-fit: cover;
      border-radius: 4px;
    }

    /* 逆引きカード表示用 */
    .reverse-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .reverse-item-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .reverse-img-lg {
      width: 36px;
      height: 36px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--accent-color);
    }

    .reverse-stage-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .reverse-stage-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1>GGENDB</h1>
  </div>

  <!-- 表示モード切替タブ -->
  <div class="view-tabs">
    <button class="tab-btn active" id="tabStage" onclick="switchView('stage')">ステージ一覧</button>
    <button class="tab-btn" id="tabReverse" onclick="switchView('reverse')">素材から探す（逆引き）</button>
  </div>

  <!-- 検索エリア -->
  <div class="search-card" id="searchCard">
    <div class="form-group">
      <label for="searchInput" id="searchLabel">🔍 検索（作品名・ステージ名・ドロップ素材名）</label>
      <input type="text" id="searchInput" placeholder="例: ガンダム, 物理格闘, STAGE 3" oninput="renderCurrentView()">
    </div>
  </div>

  <!-- 武装強化パーツの画像ショートカット（7種） -->
  <div class="quick-parts-container">
    <div class="quick-parts-title">武装強化パーツで絞り込み</div>
    <div class="quick-parts-list">
      <button class="part-btn" onclick="filterByTag('物理射撃')">
        <img src="images/shageki.webp" alt="物理射撃">
        <span>物理射撃</span>
      </button>
      <button class="part-btn" onclick="filterByTag('物理格闘')">
        <img src="images/kakutou.webp" alt="物理格闘">
        <span>物理格闘</span>
      </button>
      <button class="part-btn" onclick="filterByTag('ビーム射撃')">
        <img src="images/beam_shageki.webp" alt="ビーム射撃">
        <span>ビーム射撃</span>
      </button>
      <button class="part-btn" onclick="filterByTag('ビーム格闘')">
        <img src="images/beam_kakutou.webp" alt="ビーム格闘">
        <span>ビーム格闘</span>
      </button>
      <button class="part-btn" onclick="filterByTag('特殊射撃')">
        <img src="images/tokushu_shageki.webp" alt="特殊射撃">
        <span>特殊射撃</span>
      </button>
      <button class="part-btn" onclick="filterByTag('特殊格闘')">
        <img src="images/tokushu_kakutou.webp" alt="特殊格闘">
        <span>特殊格闘</span>
      </button>
      <button class="part-btn" onclick="filterByTag('覚醒')">
        <img src="images/kakusei.webp" alt="覚醒">
        <span>覚醒</span>
      </button>
    </div>
  </div>

  <!-- リスト表示エリア -->
  <ul id="stageList" class="stage-list"></ul>
</div>

<script>
  let stages = [];
  let currentView = 'stage';

  // GitHub上の data.json を非同期読み込み
  async function loadDataFromGitHub() {
    const listElement = document.getElementById('stageList');
    listElement.innerHTML = '<li style="text-align:center; color:#94a3b8; padding:20px;">データを読み込み中...</li>';

    try {
      const response = await fetch('data.json?t=' + new Date().getTime());
      if (!response.ok) throw new Error('data.json の読み込みに失敗しました');
      
      stages = await response.json();
      renderCurrentView();
    } catch (error) {
      console.error(error);
      listElement.innerHTML = '<li style="text-align:center; color:#ef4444; padding:20px;">データの読み込みに失敗しました。<br>data.json が存在するか確認してください。</li>';
    }
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('tabStage').classList.toggle('active', view === 'stage');
    document.getElementById('tabReverse').classList.toggle('active', view === 'reverse');

    const searchLabel = document.getElementById('searchLabel');
    if (view === 'stage') {
      searchLabel.textContent = '🔍 検索（作品名・ステージ名・ドロップ素材名）';
    } else if (view === 'reverse') {
      searchLabel.textContent = '🔍 素材名で絞り込み';
    }

    renderCurrentView();
  }

  function filterByTag(tagName) {
    const searchInput = document.getElementById('searchInput');
    searchInput.value = tagName;
    renderCurrentView();
    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function renderCurrentView() {
    if (currentView === 'stage') {
      renderStageView();
    } else if (currentView === 'reverse') {
      renderReverseView();
    }
  }

  // 7種の武装強化パーツに対応するWebP画像のパスを自動判定
  function getMaterialImagePath(name) {
    if (name === '物理射撃') return 'images/shageki.webp';
    if (name === '物理格闘') return 'images/kakutou.webp';
    if (name === 'ビーム射撃') return 'images/beam_shageki.webp';
    if (name === 'ビーム格闘') return 'images/beam_kakutou.webp';
    if (name === '特殊射撃') return 'images/tokushu_shageki.webp';
    if (name === '特殊格闘') return 'images/tokushu_kakutou.webp';
    if (name === '覚醒') return 'images/kakusei.webp';
    return null;
  }

  /* --- 1. ステージ一覧表示 --- */
  function renderStageView() {
    const listElement = document.getElementById('stageList');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    listElement.innerHTML = '';

    const filteredStages = stages.filter(stage => {
      if (!searchQuery) return true;
      const seriesMatch = (stage.series || '').toLowerCase().includes(searchQuery);
      const nameMatch = (stage.name || '').toLowerCase().includes(searchQuery);
      const dropsMatch = (stage.drops || []).some(d => {
        const dName = typeof d === 'string' ? d : d.name;
        return dName.toLowerCase().includes(searchQuery);
      });
      return seriesMatch || nameMatch || dropsMatch;
    });

    if (filteredStages.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">該当するステージ情報はありません</li>';
      return;
    }

    filteredStages.forEach(stage => {
      const li = document.createElement('li');
      li.className = 'stage-item';

      const dropsList = stage.drops || [];
      const dropTagsHtml = dropsList.map(drop => {
        const name = typeof drop === 'string' ? drop : drop.name;
        const img = getMaterialImagePath(name) || (typeof drop === 'object' && drop.image ? drop.image : null);
        const imgHtml = img ? `<img src="${img}" class="drop-img-thumb" alt="">` : '📦';

        return `
          <span class="drop-tag" onclick="filterByTag('${escapeHtml(name)}')">
            ${imgHtml} ${escapeHtml(name)}
          </span>
        `;
      }).join('');

      const seriesHtml = stage.series ? `<span class="work-tag">🎬 ${escapeHtml(stage.series)}</span>` : '';

      li.innerHTML = `
        <div class="stage-header">
          <div class="stage-title-group">
            ${seriesHtml}
            <span class="stage-title">${escapeHtml(stage.name)}</span>
          </div>
        </div>
        
        <div class="drop-section">
          <div class="drop-title">🎁 ドロップアイテム・素材（タップで検索）</div>
          <div class="drop-tags">
            ${dropTagsHtml || '<span style="font-size:0.8rem; color:#64748b;">登録なし</span>'}
          </div>
        </div>
      `;

      listElement.appendChild(li);
    });
  }

  /* --- 2. 素材からの逆引き表示 --- */
  function renderReverseView() {
    const listElement = document.getElementById('stageList');
    const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
    listElement.innerHTML = '';

    const dropMap = {};
    stages.forEach(stage => {
      (stage.drops || []).forEach(drop => {
        const name = typeof drop === 'string' ? drop : drop.name;
        const autoImg = getMaterialImagePath(name);
        const img = autoImg || (typeof drop === 'object' ? drop.image : null);

        if (!dropMap[name]) {
          dropMap[name] = { stages: [], image: img };
        }
        if (!dropMap[name].image && img) {
          dropMap[name].image = img;
        }

        const displayName = stage.series ? `[${stage.series}] ${stage.name}` : stage.name;
        dropMap[name].stages.push(displayName);
      });
    });

    const allMaterials = Object.keys(dropMap).sort();

    const filteredMaterials = allMaterials.filter(mat => {
      if (!searchQuery) return true;
      return mat.toLowerCase().includes(searchQuery);
    });

    if (filteredMaterials.length === 0) {
      listElement.innerHTML = '<li style="text-align:center; color:#64748b; padding:20px;">登録されているドロップ素材はありません</li>';
      return;
    }

    filteredMaterials.forEach(mat => {
      const data = dropMap[mat];
      const li = document.createElement('li');
      li.className = 'reverse-item';

      const imgHtml = data.image ? `<img src="${data.image}" class="reverse-img-lg" alt="">` : '📦';

      const stageBadgesHtml = data.stages.map(name => `
        <div class="reverse-stage-badge">
          <span>📍 ${escapeHtml(name)}</span>
        </div>
      `).join('');

      li.innerHTML = `
        <div class="reverse-item-title">${imgHtml} ${escapeHtml(mat)}</div>
        <div style="font-size:0.8rem; color:#94a3b8; margin-bottom:6px;">獲得可能なステージ（全${data.stages.length}件）:</div>
        <div class="reverse-stage-list">
          ${stageBadgesHtml}
        </div>
      `;

      listElement.appendChild(li);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, function(m) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[m];
    });
  }

  // 初期化（ページ表示時にJSONを取得）
  window.addEventListener('DOMContentLoaded', () => {
    loadDataFromGitHub();
  });
</script>

</body>
</html>
